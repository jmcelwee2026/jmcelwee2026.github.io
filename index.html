<style>
:root{
  --ink:#14161A; --ink-soft:#3E444D; --ink-faint:#737983;
  --gold:#C9A20E; --gold-deep:#8E7108; --gold-edge:#E2D6A9;
  --paper:#F6F3EB; --paper-warm:#EFEAD9;
  --serif:"Iowan Old Style","Charter","Palatino Linotype","Palatino","Hoefler Text",Georgia,serif;
  --sans:"Avenir Next","Optima","Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--serif); color:var(--ink); background:var(--paper);
  display:flex; min-height:100vh;
}
.rail{
  width:220px; min-height:100vh; background:var(--ink); flex:none;
  display:flex; flex-direction:column; align-items:center;
  padding:4.5rem 0 2rem;
}
.rail .mark{width:96px; height:96px}
.rail nav{
  margin-top:3rem; font-family:var(--sans); font-size:.78rem;
  letter-spacing:.16em; text-transform:uppercase; text-align:center;
  line-height:2.4;
}
.rail nav a{display:block; color:var(--ink-faint); text-decoration:none; padding:0 .8rem;}
.rail nav a:hover{color:var(--gold-edge)}
.rail nav a.current{color:var(--gold)}
.seam{width:1.5px; background:var(--gold); flex:none}
main{
  flex:1; display:flex; flex-direction:column;
  padding:11vh 9vw 4vh; max-width:900px;
}
main.long{justify-content:flex-start; padding-top:6vh}
h1{font-size:clamp(2.1rem,4.6vw,3.2rem); font-weight:700; letter-spacing:.005em}
h1.small{font-size:clamp(1.6rem,3.2vw,2.2rem)}
h2{
  font-family:var(--sans); font-size:.82rem; font-weight:700;
  letter-spacing:.18em; text-transform:uppercase; color:var(--ink-soft);
  margin:2.4rem 0 .9rem;
}
h3{
  font-family:var(--serif); font-size:1.35rem; font-weight:600;
  color:var(--ink); margin:1.8rem 0 .6rem;
}
.cred{
  font-family:var(--sans); font-size:.72rem; letter-spacing:.16em;
  text-transform:uppercase; color:var(--ink-soft); margin-top:.9rem; line-height:1.9;
}
.tagline{
  font-family:var(--sans); font-size:.78rem; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-soft); margin-top:.6rem; line-height:1.7;
}
.rule{border:none; border-top:3px double var(--gold); margin:2.2rem 0; width:6.5rem}
.rule.thin{border-top-width:1px; opacity:.5}
.rule.wide{width:12rem}
.bio{font-size:1.08rem; line-height:1.75; color:var(--ink-soft); max-width:34rem}
.bio + .bio{margin-top:1rem}
.prose{font-size:1.02rem; line-height:1.75; color:var(--ink-soft); max-width:38rem}
.prose p + p{margin-top:1rem}
.prose p b, .prose p strong{color:var(--ink); font-weight:600}
.prose ul{list-style:none; margin-top:.6rem}
.prose ul li{padding-left:1.4rem; position:relative; margin-top:.4rem; color:var(--ink-soft); line-height:1.65;}
.prose ul li::before{content:"§"; position:absolute; left:0; color:var(--gold); font-weight:600; font-size:.9rem;}
.aside{
  margin-top:1.4rem; padding:1rem 1.2rem;
  border-left:3px solid var(--gold); background:rgba(201,162,14,.05);
  font-family:var(--sans); font-size:.86rem; line-height:1.6;
  color:var(--ink-soft); max-width:38rem;
}
.contact{margin-top:2.6rem; font-family:var(--sans); font-size:.9rem; line-height:2;}
.contact a{color:var(--gold-deep); text-decoration:none; border-bottom:1px solid var(--gold-edge)}
.contact a:hover{color:var(--ink); border-bottom-color:var(--gold)}
.contact .sep{color:var(--gold); margin:0 .55rem}

.cards{margin-top:1.2rem; max-width:38rem}
.card{
  display:block; padding:1.1rem 0; border-bottom:1px solid var(--gold-edge);
  text-decoration:none; color:var(--ink);
}
.card:first-child{border-top:1px solid var(--gold-edge)}
.card:hover{background:rgba(201,162,14,.04)}
.card .card-eyebrow{
  font-family:var(--sans); font-size:.7rem; letter-spacing:.16em;
  text-transform:uppercase; color:var(--gold-deep); margin-bottom:.3rem;
}
.card .card-title{font-family:var(--serif); font-size:1.2rem; font-weight:600; color:var(--ink); line-height:1.35;}
.card .card-hook{font-family:var(--serif); font-size:.98rem; color:var(--ink-soft); margin-top:.4rem; line-height:1.6;}
.card .card-tags{font-family:var(--sans); font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); margin-top:.6rem;}

.case-meta{font-family:var(--sans); font-size:.8rem; letter-spacing:.08em; color:var(--ink-soft); margin-top:.8rem; line-height:1.7;}
.case-tags{font-family:var(--sans); font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--gold-deep); margin-top:.6rem;}

.back-link{
  display:inline-block; font-family:var(--sans); font-size:.78rem;
  letter-spacing:.14em; text-transform:uppercase; color:var(--gold-deep);
  text-decoration:none; margin-top:3rem;
}
.back-link:hover{color:var(--ink)}
.back-link::before{content:"← "; color:var(--gold)}

.capability-grid{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:1.4rem; margin-top:1rem; max-width:38rem;
}
.capability-grid .cat{
  font-family:var(--sans); font-size:.72rem; letter-spacing:.16em;
  text-transform:uppercase; color:var(--gold-deep); font-weight:700;
  margin-bottom:.4rem;
}
.capability-grid .items{
  font-family:var(--serif); font-size:.98rem; color:var(--ink-soft);
  line-height:1.55;
}

footer{margin-top:auto; padding-top:3rem; max-width:38rem;}
footer .disclaimer{
  font-family:var(--sans); font-size:.72rem; line-height:1.6;
  color:var(--ink-faint); font-style:italic;
  border-top:1px solid var(--gold-edge); padding-top:1rem;
}
footer .signoff{font-family:var(--sans); font-size:.72rem; letter-spacing:.06em; color:var(--ink-faint); margin-top:1rem;}
footer .signoff a{color:inherit; text-decoration:none; border-bottom:1px dotted var(--gold-edge)}

@media (max-width:760px){
  body{flex-direction:column}
  .rail{
    width:100%; min-height:0; padding:2rem 1.4rem 1.4rem;
    flex-direction:row; justify-content:space-between; align-items:center;
  }
  .rail .mark{width:56px; height:56px}
  .rail nav{
    margin-top:0; font-size:.66rem; line-height:1.4; text-align:right;
    display:flex; flex-wrap:wrap; gap:.4rem .9rem; justify-content:flex-end;
  }
  .rail nav a{display:inline; padding:0}
  .seam{width:100%; height:1.5px}
  main{padding:2.4rem 1.6rem 2rem}
  h2{margin-top:2rem}
  footer{padding-top:2.4rem}
}

/* Home only: a slow light pass down the gold seam */
.seam{
  background:linear-gradient(180deg,
    var(--gold) 0%, var(--gold) 38%,
    #E8D073 45%,
    #F6ECC2 50%,
    #E8D073 55%,
    var(--gold) 62%, var(--gold) 100%);
  background-size:100% 340%;
  animation:seamShimmer 14s ease-in-out infinite;
}
@keyframes seamShimmer{
  0%, 22%   {background-position:50% 0%}
  78%, 100% {background-position:50% 100%}
}
@media (max-width:760px){
  .seam{
    background:linear-gradient(90deg,
      var(--gold) 0%, var(--gold) 38%,
      #E8D073 45%, #F6ECC2 50%, #E8D073 55%,
      var(--gold) 62%, var(--gold) 100%);
    background-size:340% 100%;
    animation:seamShimmerX 14s ease-in-out infinite;
  }
  @keyframes seamShimmerX{
    0%, 22%   {background-position:0% 50%}
    78%, 100% {background-position:100% 50%}
  }
}
@media (prefers-reduced-motion: reduce){
  .seam{animation:none; background:var(--gold)}
}
</style>
</head>
